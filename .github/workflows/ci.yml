name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Run tests with coverage
        run: |
          python -m pytest -q \
            --cov=greek_nlp \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-test-reports
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t greek-news-nlp-api .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 greek-news-nlp-api
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f api 2>/dev/null || true
