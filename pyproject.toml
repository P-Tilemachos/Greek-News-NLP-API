[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-news-nlp-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "pre-commit", "rank-bm25==0.2.2"]
ml = ["torch", "transformers", "sentence-transformers", "faiss-cpu", "huggingface-hub", "rank-bm25==0.2.2"]
llm = ["torch>=2.2", "transformers>=4.45,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]